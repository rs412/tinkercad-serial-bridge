<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Tinkercad Serial Bridge</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 300px;
            padding: 14px;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            font-size: 13px;
            color: #1f2328;
            background: #fff;
        }
        h1 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .card {
            border: 1px solid #e3e6ea;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            background: #fafbfc;
        }
        .card-title {
            font-size: 12px;
            color: #656d76;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            gap: 8px;
        }
        .row:last-child { margin-bottom: 0; }
        label { font-size: 12px; color: #424a53; }
        input[type="text"], input[type="number"] {
            width: 150px;
            padding: 5px 7px;
            font-size: 12px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            outline: none;
        }
        input[type="text"]:focus, input[type="number"]:focus { border-color: #2196F3; }
        input.full { width: 100%; }
        button {
            padding: 6px 10px;
            font-size: 12px;
            border: none;
            border-radius: 6px;
            background: #2196F3;
            color: #fff;
            cursor: pointer;
        }
        button:hover { background: #1976D2; }
        button:disabled { background: #b6c2cd; cursor: not-allowed; }
        button.ghost {
            background: #fff;
            color: #424a53;
            border: 1px solid #d0d7de;
        }
        button.ghost:hover { background: #f3f4f6; }
        .btn-row { display: flex; gap: 8px; }
        .btn-row button { flex: 1; }
        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #b6c2cd;
            margin-right: 5px;
            vertical-align: middle;
        }
        .dot.ok { background: #1f883d; }
        .dot.error { background: #cf222e; }
        .dot.warn { background: #bf8700; }
        .kv {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #656d76;
            padding: 2px 0;
            gap: 10px;
        }
        .kv .v {
            color: #1f2328;
            max-width: 170px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .toggle-switch { position: relative; width: 38px; height: 20px; flex: none; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; inset: 0;
            background: #ccc;
            border-radius: 20px;
            cursor: pointer;
            transition: .2s;
        }
        .slider:before {
            content: "";
            position: absolute;
            height: 16px; width: 16px;
            left: 2px; bottom: 2px;
            background: #fff;
            border-radius: 50%;
            transition: .2s;
        }
        .toggle-switch input:checked + .slider { background: #2196F3; }
        .toggle-switch input:checked + .slider:before { transform: translateX(18px); }
        details { margin-bottom: 10px; }
        summary {
            font-size: 12px;
            color: #656d76;
            cursor: pointer;
            padding: 4px 0;
            user-select: none;
        }
        details .card { margin-top: 6px; margin-bottom: 0; }
        .hint { font-size: 11px; color: #8b949e; line-height: 1.5; }
        .toast {
            font-size: 11px;
            min-height: 15px;
            color: #1f883d;
            text-align: center;
        }
        .toast.error { color: #cf222e; }
    </style>
</head>
<body>
    <h1><span class="dot" id="globalDot"></span>Tinkercad Serial Bridge</h1>

    <div class="card">
        <div class="card-title">运行状态</div>
        <div class="kv"><span>中转服务</span><span class="v" id="stServer">未知</span></div>
        <div class="kv"><span>Tinkercad 页面</span><span class="v" id="stPage">未连接</span></div>
        <div class="kv"><span>最近上行</span><span class="v" id="stUp">—</span></div>
        <div class="kv"><span>最近下行</span><span class="v" id="stDown">—</span></div>
        <div class="kv"><span>累计 上/下</span><span class="v" id="stCount">0 / 0</span></div>
        <div class="kv"><span>元素检测</span><span class="v" id="stDom">—</span></div>
    </div>

    <div class="card">
        <div class="row">
            <label for="baseUrl">服务地址</label>
            <input type="text" id="baseUrl" placeholder="http://localhost:8080">
        </div>
        <div class="row">
            <label for="uploadInterval">上行间隔 (ms)</label>
            <input type="number" id="uploadInterval" min="100" max="60000" step="100" placeholder="800">
        </div>
        <div class="row">
            <label for="cmdInterval">指令轮询 (ms)</label>
            <input type="number" id="cmdInterval" min="100" max="60000" step="100" placeholder="2000">
        </div>
        <div class="row">
            <label for="lineFilter">行过滤（含该串才上报）</label>
            <input type="text" id="lineFilter" placeholder="留空 = 全部">
        </div>
        <div class="row">
            <label for="enableToggle">启用桥接</label>
            <label class="toggle-switch">
                <input type="checkbox" id="enableToggle">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="btn-row" style="margin-bottom:10px;">
        <button id="saveBtn">保存设置</button>
        <button id="testBtn" class="ghost">测试连接</button>
    </div>

    <div class="card">
        <div class="card-title">手动下发指令</div>
        <input type="text" id="manualCmd" class="full" placeholder='例如 {"led":"on"}' style="margin-bottom:8px;">
        <div class="btn-row">
            <button id="sendCmdBtn">发送</button>
        </div>
    </div>

    <details>
        <summary>高级：自定义选择器</summary>
        <div class="card">
            <div class="row">
                <label for="monitorSelector">监视器</label>
                <input type="text" id="monitorSelector" placeholder="留空自动探测">
            </div>
            <div class="row">
                <label for="inputSelector">输入框</label>
                <input type="text" id="inputSelector" placeholder="留空自动探测">
            </div>
            <div class="row">
                <label for="sendSelector">发送按钮</label>
                <input type="text" id="sendSelector" placeholder="留空自动探测">
            </div>
            <p class="hint">Tinkercad 前端发版后类名可能变化，导致自动探测失效。此时打开 Tinkercad 页面检查元素，把选择器填到这里即可，无需更新插件。</p>
        </div>
    </details>

    <div class="toast" id="toast"></div>

    <script src="popup.js"></script>
</body>
</html>
